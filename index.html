<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TyCo Home</title>
    <style>
        :root {
            --bg1: rgba(255, 255, 255, 0.98);
            --bg2: rgba(235, 251, 255, 0.96);
            --bg3: rgba(232, 255, 245, 0.95);
            --card: rgba(255, 255, 255, 0.96);
            --text: #111827;
            --muted: #4b5563;
            --accent1: #16a7ff;
            --accent2: #19d3b2;
            --shadow: 0 12px 30px rgba(15, 23, 42, 0.10);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top left, rgba(25, 211, 178, 0.10), transparent 34%),
                radial-gradient(circle at bottom right, rgba(22, 167, 255, 0.10), transparent 34%),
                linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 48%, var(--bg3) 100%);
        }

        .page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 48px 20px;
        }

        .hero {
            text-align: center;
            max-width: 760px;
            margin-bottom: 36px;
        }

        .hero h1 {
            margin: 0 0 10px;
            font-size: clamp(2rem, 4vw, 3.2rem);
            line-height: 1.1;
            letter-spacing: -0.03em;
        }

        .hero p {
            margin: 0;
            font-size: clamp(1rem, 1.6vw, 1.15rem);
            color: var(--muted);
        }

        .cards {
            width: 100%;
            max-width: 920px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 24px;
            align-items: stretch;
        }

        .card {
            background: var(--card);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 28px;
            box-shadow: var(--shadow);
            padding: 28px 24px 26px;
            text-align: center;
            backdrop-filter: blur(10px);
            transition: transform 180ms ease, box-shadow 180ms ease;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 34px rgba(15, 23, 42, 0.14);
        }

        .logo-wrap {
            width: 116px;
            height: 116px;
            margin: 0 auto 18px;
            display: grid;
            place-items: center;
        }

        .logo-wrap img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .card h2 {
            margin: 0 0 8px;
            font-size: 2rem;
            line-height: 1.05;
            letter-spacing: -0.02em;
        }

        .card p {
            margin: 0 0 20px;
            font-size: 1rem;
            color: var(--muted);
            line-height: 1.45;
            min-height: 3em;
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 180px;
            padding: 14px 22px;
            border-radius: 999px;
            text-decoration: none;
            color: #082f49;
            font-weight: 700;
            font-size: 1rem;
            background: linear-gradient(90deg, #32c7ff 0%, #23e0c1 100%);
            box-shadow: 0 10px 18px rgba(22, 167, 255, 0.18);
            transition: transform 180ms ease, filter 180ms ease;
        }

        .button:hover {
            transform: translateY(-1px);
            filter: brightness(1.02);
        }

        .button:focus-visible {
            outline: 3px solid rgba(22, 167, 255, 0.35);
            outline-offset: 3px;
        }

        .footer-note {
            margin-top: 24px;
            color: rgba(75, 85, 99, 0.82);
            font-size: 0.92rem;
            text-align: center;
        }

        @media (max-width: 640px) {
            .page {
                padding: 28px 16px 36px;
            }

            .hero {
                margin-bottom: 26px;
            }

            .card {
                padding: 24px 18px 22px;
                border-radius: 24px;
            }

            .logo-wrap {
                width: 102px;
                height: 102px;
            }

            .card h2 {
                font-size: 1.75rem;
            }

            .button {
                min-width: 100%;
            }
        }
    </style>
</head>
<body>
    <main class="page">
        <section class="hero" aria-label="TyCo Home">
            <h1>TyCo Home</h1>
            <p>Innovations no one else dares to make.</p>
        </section>

        <section class="cards" aria-label="Projects">
            <article class="card">
                <div class="logo-wrap">
                    <img src="genai.png" alt="Gen AI logo">
                </div>
                <h2>Gen AI</h2>
                <p>Artificial intelligence the way it should be.</p>
                <a class="button" href="https://tycoinnovations.github.io/gen-ai/">Go to Gen AI</a>
            </article>

            <article class="card">
                <div class="logo-wrap">
                    <img src="prophet.png" alt="Prophet logo">
                </div>
                <h2>Prophet</h2>
                <p>Smarter insights, cleaner predictions, better decisions.</p>
                <a class="button" href="https://tycoinnovations.github.io/prophet/">Go to Prophet</a>
            </article>
        </section>
    </main>
</body>
</html>
