<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TyCo Homepage</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(90deg, #00bfff, #32cd32);
            color: #ffffff;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        h1, h2 {
            color: #fff;
        }
        button {
            background-color: #fff;
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }
        img {
            height: 40px;
            margin-right: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Innovations no one else dares to create</h1>
        </header>
        <div class="card">
            <img src="gen-ai" alt="Gen AI logo">
            <div>
                <h2>Gen AI Project</h2>
                <p>AI the way it should be</p>
            </div>
            <button href="https://tycoinnovations.github.io/gen-ai/">Visit</button>
        </div>
        <div class="card">
            <img src="prophet" alt="Prophet logo">
            <div>
                <h2>Prophet Project</h2>
                <p>Meeting or webinar, host it for free.</p>
            </div>
            <button href="https://tycoinnovations.github.io/prophet/">Visit</button>
        </div>
    </div>
</body>
</html>
